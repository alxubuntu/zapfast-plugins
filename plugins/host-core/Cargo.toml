[package]
name = "zapfast-plugin-host-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tempfile = "3"
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "macros"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[workspace]
